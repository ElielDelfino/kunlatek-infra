name: Terraform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy

permissions:
  contents: read
  id-token: write

# Variáveis sensíveis injetadas via GitHub Secrets como TF_VAR_*
# Variáveis não-sensíveis (região, CIDRs, tamanhos) usam os defaults de variables.tf
env:
  TF_VAR_eks_admin_iam_arn:           ${{ secrets.TF_VAR_EKS_ADMIN_IAM_ARN }}
  TF_VAR_eks_admin_iam_arn_2:         ${{ secrets.TF_VAR_EKS_ADMIN_IAM_ARN_2 }}
  TF_VAR_eks_github_actions_role_arn: ${{ secrets.TF_VAR_EKS_GITHUB_ACTIONS_ROLE_ARN }}
  TF_VAR_db_password:                 ${{ secrets.TF_VAR_DB_PASSWORD }}
  TF_VAR_jwt_secret:                  ${{ secrets.TF_VAR_JWT_SECRET }}
  TF_VAR_datadog_api_key:             ${{ secrets.TF_VAR_DATADOG_API_KEY }}
  TF_VAR_datadog_app_key:             ${{ secrets.TF_VAR_DATADOG_APP_KEY }}

jobs:
  # -------------------------------------------------------
  # Plan — roda em todo push de tag e quando action=plan
  # Valida o código e mostra o que será alterado
  # -------------------------------------------------------
  plan:
    name: Init + Validate + Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'plan'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  # -------------------------------------------------------
  # Apply — 3 stages espelhando o Makefile
  # Stage 1: infra base (EKS, RDS, VPC, IAM)
  # Stage 2: Helm charts (requer cluster do stage 1)
  # Stage 3: apply completo (Datadog, recursos restantes)
  # -------------------------------------------------------
  apply:
    name: Apply (3 stages)
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Stage 1 — Infra base + IAM
        run: |
          terraform apply --auto-approve \
            -target=module.network \
            -target=module.eks_kms \
            -target=module.eks \
            -target=module.database \
            -target=module.ecr \
            -target=module.irsa_ebs_csi \
            -target=module.sqs_worker \
            -target=aws_eks_addon.vpc_cni \
            -target=aws_eks_addon.ebs_csi \
            -target=aws_secretsmanager_secret.app \
            -target=aws_secretsmanager_secret_version.app \
            -target=aws_iam_role.app_sa \
            -target=aws_iam_role_policy.app_sa_secrets \
            -target=aws_iam_role_policy.app_sa_sqs \
            -target=aws_iam_role.eso \
            -target=aws_iam_role_policy.eso_secrets

      - name: Stage 2 — EKS Add-ons (Helm charts)
        run: terraform apply --auto-approve -target=module.eks_addons

      - name: Stage 3 — Apply completo
        run: terraform apply --auto-approve

  # -------------------------------------------------------
  # Plan Destroy — mostra o que será destruído sem executar
  # -------------------------------------------------------
  plan-destroy:
    name: Plan Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'plan-destroy'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan Destroy
        run: terraform plan -destroy

  # -------------------------------------------------------
  # Destroy — destrói toda a infra
  # -------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Destroy
        run: terraform destroy --auto-approve
